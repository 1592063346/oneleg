<!DOCTYPE html>
<html lang="zh-CN" class="viz-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>万籁阁游戏王比赛数据</title>
  <style>
    .viz-root {
      color-scheme: light;
      --surface-1: #fcfcfb;
      --page: #f9f9f7;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --muted: #898781;
      --grid: #e1e0d9;
      --baseline: #c3c2b7;
      --border: rgba(11, 11, 11, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])).viz-root {
        color-scheme: dark;
        --surface-1: #1a1a19;
        --page: #0d0d0d;
        --text-primary: #ffffff;
        --text-secondary: #c3c2b7;
        --muted: #898781;
        --grid: #2c2c2a;
        --baseline: #383835;
        --border: rgba(255, 255, 255, 0.10);
      }
    }
    :root[data-theme="dark"].viz-root {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255, 255, 255, 0.10);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }
    #app { max-width: 960px; margin: 0 auto; padding: 0 20px 48px; }

    /* 菜单 */
    .menu {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 18px 0; flex-wrap: wrap;
      border-bottom: 1px solid var(--border); margin-bottom: 24px;
    }
    .brand { font-size: 18px; font-weight: 700; }
    .tabs { display: flex; gap: 4px; background: var(--surface-1);
      border: 1px solid var(--border); border-radius: 10px; padding: 4px; }
    .tab {
      border: 0; background: transparent; color: var(--text-secondary);
      font: inherit; padding: 8px 18px; border-radius: 7px; cursor: pointer;
      transition: background .12s ease, color .12s ease;
    }
    .tab:hover { color: var(--text-primary); }
    .tab.active { background: #2a78d6; color: #fff; }

    /* 控件 */
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .controls-label, .controls label { color: var(--text-secondary); }
    select {
      font: inherit; padding: 7px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface-1);
      color: var(--text-primary); cursor: pointer;
    }

    /* 自定义比赛下拉（饼图模式） */
    .match-dropdown { position: relative; }
    .match-dropdown-btn {
      display: inline-flex; align-items: center; gap: 8px;
      font: inherit; padding: 7px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface-1);
      color: var(--text-primary); cursor: pointer;
    }
    .dropdown-arrow { font-size: 10px; color: var(--muted); margin-left: 4px; }
    .match-dropdown-list {
      position: absolute; top: 100%; left: 0; margin-top: 4px; z-index: 10;
      background: var(--surface-1); border: 1px solid var(--border);
      border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      min-width: 230px; max-height: 320px; overflow-y: auto;
    }
    .match-dropdown-list ul { list-style: none; margin: 0; padding: 4px; }
    .match-dropdown-list li {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 6px; cursor: pointer;
    }
    .match-dropdown-list li:hover { background: var(--page); }
    .match-dropdown-list li.active { background: var(--page); font-weight: 600; }

    /* 类型标签（按钮和列表中的小徽章） */
    .type-tag {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .type-tag-purple { color: #8b5cf6; background: rgba(139, 92, 246, 0.12); }
    .type-tag-green { color: #10b981; background: rgba(16, 185, 129, 0.12); }
    .type-tag-orange { color: #f97316; background: rgba(249, 115, 22, 0.12); }
    .deck-picker { gap: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px;
      background: var(--surface-1); cursor: pointer; user-select: none;
    }
    .chip input { accent-color: #2a78d6; margin: 0; }
    /* 趋势模式类型筛选：彩色 + 加粗 */
    .chip-type-purple > span { color: #8b5cf6; font-weight: 700; }
    .chip-type-green > span { color: #10b981; font-weight: 700; }
    .chip-type-orange > span { color: #f97316; font-weight: 700; }

    /* 详情 */
    .detail-header h2 { font-size: 20px; margin: 0 0 10px; }
    .meta-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .badge { display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 999px; background: var(--surface-1);
      border: 1px solid var(--border); font-size: 13px; }
    .badge-k { color: var(--muted); }
    .badge-v { color: var(--text-primary); font-weight: 600; }
    /* 比赛类型颜色 */
    .badge-purple .badge-v { color: #8b5cf6; }
    .badge-green .badge-v { color: #10b981; }
    .badge-orange .badge-v { color: #f97316; }

    /* 排名展示（已合并到饼图框内） */
    .rankings { margin-bottom: 16px; }
    .ranking-line { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
    .ranking-line:last-child { margin-bottom: 0; }
    .rank-label { color: var(--text-secondary); font-weight: 600; min-width: 70px; flex-shrink: 0; }
    .rank-players { display: flex; flex-direction: column; gap: 4px; }
    .rank-item { color: var(--text-primary); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .deck-badge { display: inline-block; padding: 2px 10px; border-radius: 999px;
      background: var(--page); border: 1px solid var(--border);
      font-size: 13px; font-weight: 600; color: var(--text-primary); }

    /* 饼图内分隔线 */
    .pie-divider { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }

    /* others 明细：与饼图同框，靠顶部细分隔线区隔 */
    .others-detail { margin-top: 18px; padding-top: 18px;
      border-top: 1px solid var(--border); }
    .others-detail h3 { margin: 0 0 10px; font-size: 15px; color: var(--text-secondary); }
    .others-list { list-style: none; margin: 0; padding: 0;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 18px; }
    .others-list li { display: flex; justify-content: space-between; gap: 10px;
      padding: 3px 0; border-bottom: 1px dashed var(--border); }
    .others-num { color: var(--text-secondary); font-variant-numeric: tabular-nums; }

    /* 趋势：搜索添加 */
    .deck-input { font: inherit; padding: 8px 12px; min-width: 240px;
      border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface-1); color: var(--text-primary); }
    .deck-action-btn { font: inherit; padding: 7px 14px;
      border-radius: 8px; border: 1px solid #34d399;
      background: #34d399; color: white;
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
      white-space: nowrap; }
    .deck-action-btn:hover { background: #10b981; border-color: #10b981; }
    .deck-action-clear { background: #f87171; border-color: #f87171; }
    .deck-action-clear:hover { background: #ef4444; border-color: #ef4444; }
    .date-input { font: inherit; padding: 7px 12px;
      border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface-1); color: var(--text-primary); cursor: pointer; }
    .date-separator { color: var(--text-secondary); }
    .date-clear-btn { font: inherit; padding: 7px 12px;
      border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface-1); color: var(--text-secondary);
      cursor: pointer; transition: background 0.15s, color 0.15s; }
    .date-clear-btn:hover { background: var(--page); color: var(--text-primary); }
    .selected-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; min-height: 4px; }
    .picked-chip { display: inline-flex; align-items: center; gap: 8px;
      padding: 5px 8px 5px 10px; border-radius: 999px;
      background: var(--surface-1); border: 1px solid var(--border); font-size: 14px; }
    .chip-remove { border: 0; background: transparent; color: var(--muted);
      cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; border-radius: 4px; }
    .chip-remove:hover { color: var(--text-primary); }

    .desc { color: var(--text-secondary); margin: 0 0 20px;
      padding: 10px 14px; background: var(--surface-1);
      border: 1px solid var(--border); border-radius: 10px;
      white-space: pre-line; }

    /* 图表容器 */
    .line-wrap, .chart-host {
      background: var(--surface-1); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px;
    }
    /* 饼图 + others 明细合并为同一个框，中间用细分隔线隔开 */
    .pie-view-inner {
      background: var(--surface-1); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px; position: relative;
    }
    /* 饼图整体居中，标签直接标注在饼块旁 */
    .pie-title { text-align: center; margin: 4px 0 8px; font-size: 17px; font-weight: 700; }
    .pie-wrap { display: flex; justify-content: center; position: relative; }
    .pie-view-inner svg { height: auto; }
    .pie-wrap svg { width: 100%; max-width: 760px; height: auto; }

    /* 导出按钮 */
    .export-btn-wrap { position: absolute; top: 8px; right: 8px; z-index: 10; }
    .export-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text-primary); font: inherit;
      cursor: pointer; font-size: 14px; font-weight: 500;
      transition: background 0.15s; }
    .export-btn:hover { background: var(--surface-1); }
    .export-btn:active { background: var(--border); }
    .line-wrap svg { max-width: 100%; height: auto; }

    /* 折线图图例（趋势模式仍使用） */
    .legend { list-style: none; margin: 0; padding: 0; display: flex;
      flex-direction: row; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; }
    .legend li { display: flex; align-items: center; gap: 8px; }
    .swatch { width: 14px; height: 14px; border-radius: 4px; flex: none; }
    .legend-label { color: var(--text-primary); }

    .empty-note { color: var(--muted); text-align: center; padding: 40px 0; }
    .error { padding: 24px; border-radius: 12px; background: var(--surface-1);
      border: 1px solid var(--border); color: var(--text-primary); }
    .error small { color: var(--muted); }

    /* 提示层 */
    .viz-tooltip {
      position: fixed; z-index: 50; pointer-events: none;
      background: var(--surface-1); color: var(--text-primary);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 12px; font-size: 13px; line-height: 1.5;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18); max-width: 240px;
    }
    .viz-tooltip .tt-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .viz-tooltip .tt-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
    .viz-tooltip .tt-num { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }

    /* 移动端优化 */
    @media (max-width: 768px) {
      body { padding: 12px; }
      .container { padding: 16px; }
      .pie-view-inner { padding: 12px; }
      .detail-header h2 { font-size: 18px; }
      .meta-row { gap: 6px; }
      .badge { font-size: 12px; padding: 4px 10px; }
      .rankings { padding: 10px 12px; }
      .rank-label { min-width: 60px; font-size: 14px; }
      .rank-item { font-size: 14px; }
      .deck-badge { font-size: 12px; padding: 2px 8px; }
    }

    @media (max-width: 480px) {
      body { padding: 8px; }
      .container { padding: 12px; }
      h1 { font-size: 20px; }
      .pie-view-inner { padding: 10px; }
      .detail-header h2 { font-size: 16px; }
      .rankings { padding: 8px 10px; }
      .ranking-line { flex-direction: column; gap: 4px; align-items: flex-start; }
      .rank-label { min-width: auto; }
    }

    /* 卡组徽章分隔符 */
    .deck-badge-divider {
      display: inline-block;
      width: 1px;
      height: 0.9em;
      background: currentColor;
      margin: 0 6px;
      vertical-align: middle;
      opacity: 0.4;
    }

    /* 卡组预览链接 */
    .deck-preview-link {
      color: #5b9bd5;
      text-decoration: underline;
      cursor: pointer;
      transition: color 0.15s;
      font-weight: normal;
    }
    .deck-preview-link:hover {
      color: #3a7cbd;
    }

    /* 卡组弹窗 */
    .deck-modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 100; display: flex; align-items: center; justify-content: center;
    }
    .deck-modal-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
    }
    .deck-modal-content {
      position: relative; z-index: 1;
      background: var(--surface-1); border: 1px solid var(--border);
      border-radius: 14px;
      max-height: 85vh; display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .deck-modal-header {
      padding: 20px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; position: relative;
    }
    .deck-modal-header h3 {
      margin: 0; font-size: 18px; font-weight: 700; flex: 1;
    }
    .deck-modal-header-buttons {
      display: flex; align-items: center; gap: 8px;
    }
    .deck-modal-help {
      border: 0; background: transparent; color: var(--text-secondary);
      font-size: 20px; line-height: 1; cursor: help; padding: 0;
      width: 28px; height: 28px; border-radius: 6px;
      transition: background 0.15s, color 0.15s;
      font-weight: bold;
    }
    .deck-modal-help:hover { background: var(--page); color: var(--text-primary); }
    .deck-modal-subtitle {
      margin: 4px 0 0; font-size: 13px; color: var(--text-secondary);
    }
    .deck-modal-close {
      border: 0; background: transparent; color: var(--text-secondary);
      font-size: 32px; line-height: 1; cursor: pointer; padding: 0;
      width: 32px; height: 32px; border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .deck-modal-close:hover { background: var(--page); color: var(--text-primary); }
    .deck-modal-body {
      padding: 20px 24px; overflow-y: auto; flex: 1;
    }
    .deck-section { margin-bottom: 24px; }
    .deck-section:last-child { margin-bottom: 0; }
    .deck-section-header {
      margin-bottom: 12px; font-size: 15px;
      color: var(--text-primary);
    }
    .deck-count { color: var(--text-secondary); font-weight: 400; }
    .deck-grid {
      display: grid; grid-template-columns: repeat(10, 60px);
      gap: 0; justify-content: start;
      line-height: 0;
    }
    .deck-card-link {
      display: block; overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s, z-index 0s;
      position: relative;
    }
    .deck-card-link:hover {
      transform: scale(1.15);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }

    .deck-card-image {
      display: block; width: 60px; height: 88px; object-fit: cover;
    }

    @media (max-width: 768px) {
      .deck-modal-content { width: 95%; max-height: 90vh; }
      .deck-modal-header { padding: 16px 18px; }
      .deck-modal-body { padding: 16px 18px; }
      .deck-grid { grid-template-columns: repeat(9, 60px); }
    }

    @media (max-width: 660px) {
      .deck-grid { grid-template-columns: repeat(8, 60px); gap: 0; }
      .deck-modal-header h3 { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <p class="empty-note">正在加载…</p>
  </div>
  <script src="./bundle.js"></script>
</body>
</html>
