<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body>
<div id="status">Testing...</div>
<script type="module">
try {
  console.log('1. Script started');
  const { loadData } = await import('./dist/data.js');
  console.log('2. data.js loaded');
  const data = await loadData();
  console.log('3. Data loaded:', data);
  document.getElementById('status').textContent = 'Success! Found ' + data.length + ' matches';
} catch(err) {
  console.error('Error:', err);
  document.getElementById('status').textContent = 'Error: ' + err.message;
  document.getElementById('status').innerHTML += '<br><pre>' + err.stack + '</pre>';
}
</script>
</body>
</html>
